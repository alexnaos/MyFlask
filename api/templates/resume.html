{% extends "base.html" %}
{% block title %}Резюме{% endblock %}
{% block content %}
<div class="card mt-4 shadow-sm">
  <!-- Шапка карточки: убрали bg-dark и text-white, оставили светлый фон -->
  <div class="card-header bg-light p-0 border-bottom">
    <ul class="nav nav-tabs card-header-tabs m-0" id="resumeTabs" role="tablist">
      {% for key, info in resumes_info.items() %}
      <li class="nav-item" role="presentation">
        <button class="nav-link {% if key == active_tab %}active{% endif %}" 
                id="tab-{{ key }}" 
                data-bs-toggle="tab" 
                data-bs-target="#content-{{ key }}" 
                type="button" 
                role="tab" 
                aria-controls="content-{{ key }}" 
                aria-selected="{% if key == active_tab %}true{% else %}false{% endif %}">
          {{ info.title }}
        </button>
      </li>
      {% endfor %}
    </ul>
  </div>
  
  <!-- card-body в Bootstrap по умолчанию белый, стиль background-color убран за ненадобностью -->
  <div class="card-body">
    <div class="tab-content" id="resumeTabsContent">
      {% for key, html_content in resumes.items() %}
      <div class="tab-pane fade {% if key == active_tab %}show active{% endif %}" 
           id="content-{{ key }}" 
           role="tabpanel" 
           aria-labelledby="tab-{{ key }}">
        <!-- Заменили инлайн-стили на класс fs-5 (чуть крупнее текст) -->
        <div class="fs-5 lh-base">
          {{ html_content | safe }}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
