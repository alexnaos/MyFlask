{% extends "base.html" %}
{% block title %}Резюме{% endblock %}
{% block content %}

<div class="card-mama mb-8">
  <!-- Шапка карточки с вкладками -->
  <div class="mb-4 border-b border-gray-200">
    <ul class="flex gap-8 border-b border-gray-200 mb-4" id="resumeTabs" role="tablist">
      {% for key, info in resumes_info.items() %}
      <li role="presentation">
        <button class="nav-link {% if key == active_tab %}text-blue-700 border-b-2 border-blue-700 font-bold pb-2{% else %}text-gray-500 hover:text-gray-700 pb-2 border-b-2 border-transparent{% endif %}"
                id="tab-{{ key }}"
                data-bs-toggle="tab"
                data-bs-target="#content-{{ key }}"
                type="button"
                role="tab"
                aria-controls="content-{{ key }}"
                aria-selected="{% if key == active_tab %}true{% else %}false{% endif %}">
          {{ info.title }}
        </button>
      </li>
      {% endfor %}
    </ul>
    <button id="shareResume" class="btn-mama btn-mama-secondary text-xs px-2 py-1" title="Поделиться резюме">
      Поделиться
    </button>
  </div>

  <div id="resumeTabsContent">
    {% for key, html_content in resumes.items() %}
    <div class="tab-pane {% if key == active_tab %}block{% else %}hidden{% endif %}"
         id="content-{{ key }}"
         role="tabpanel"
         aria-labelledby="tab-{{ key }}">
      <div class="literary-text-mama">
        {{ html_content | safe }}
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script>
  (function () {
    const btn = document.getElementById('shareResume');
    if (!btn) return;
    btn.addEventListener('click', async function () {
      const url = window.location.href;
      const title = document.title || 'Резюме';
      try {
        if (navigator.share) {
          await navigator.share({ title, text: title, url });
          btn.innerText = 'Поделились';
          setTimeout(function() { btn.innerText = 'Поделиться'; }, 2000);
        } else {
          await navigator.clipboard.writeText(url);
          btn.innerText = 'Скопировано';
          setTimeout(function() { btn.innerText = 'Поделиться'; }, 2000);
        }
      } catch (e) {
        console.error('Share failed', e);
      }
    });
  })();
</script>

{% endblock %}
