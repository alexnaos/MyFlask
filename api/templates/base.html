<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Danie Nell's portfolio: finance automation, Python engineering, data projects, and practical technical writing." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{ canonical_url }}" />
    <meta property="og:title" content="{{ self.title()|striptags }} | {{ your_name }}" />
    <meta property="og:description" content="Finance automation, Python engineering, data projects, and practical technical writing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
      crossorigin="anonymous" />
      
    <!-- Font Awesome (оставил как было) -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      crossorigin="anonymous" />

    <link rel="icon" type="image/svg+xml" href="../static/images/favicon.svg" />

    <title>{% block title %}Home{% endblock %} | {{your_name}}</title>
    
    <script type="application/ld+json">
      {{ {"@context": "https://schema.org", "@type": "Person", "name": your_name, "url": "https://" ~ domain, "sameAs": [github, linkedin, twitter]} | tojson }}
    </script>
    
    <!-- Твои кастомные стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
      .container-sm {
        max-width: 70%;
        margin: auto;
      }

      @media screen and (max-width: 1200px) {
        .container-sm {
          max-width: 90%;
        }
      }
    </style>
  </head>

  <body class="container text-white" style="background-color: #110f10">
    <div class="container-sm">
      <div
        class="d-flex flex-row align-items-center align-self-center"
        style="padding-top: 80px">
        <a href="{{ url_for('home') }}">
          <img
            src="{{ url_for('static', filename='images/headshot.jpg') }}"
            class="img-thumbnail rounded-circle"
            alt="{{your_name}}"
            width="100"
            height="100" />
        </a>

        <div class="h1 p-3">{{your_name}}</div>
        <div class="nav-line"></div>
      </div>

      <nav class="container navbar navbar-expand navbar-dark">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">
          <div class="navbar-nav ms-auto">
            <a href="{{ url_for('home') }}" class="nav-item nav-link" id="home">home</a>
            <a href="{{ url_for('resume') }}" class="nav-item nav-link" id="resume">resume</a>
            <!-- <a href="/about " class="nav-item nav-link" id="about ">about</a> -->
            <a href="/projects/" class="nav-item nav-link" id="projects">projects</a>
            <a href="{{ url_for('posts') }}" class="nav-item nav-link" id="blog">blog</a>
            <a href="/schematics/ats" class="nav-item nav-link {% if request.path.startswith('/schematics') %}active{% endif %}">Схемы щита</a>
          </div>
        </div>
      </nav>
      
      <div class="container">{% block content%} {% endblock %}</div>
      
      <small style="display: block; margin-top: 8rem">
        <div class="time text-secondary me-3 text-end">
          {{current_year}} © {{your_name}}
        </div>
      </small>
    </div>

    <!-- Bootstrap 5.3.8 JS Bundle (включает Popper, не требует jQuery) -->
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
      crossorigin="anonymous"></script>
      
    <script
      type="text/javascript "
      src="{{ url_for( 'static', filename='index.js' ) }} "></script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Start of HubSpot Embed Code -->
    {% if hubspot %}<script
      type="text/javascript"
      id="hs-script-loader"
      async
      defer
      src="{{hubspot}}"></script>{% endif %}
    <!-- End of HubSpot Embed Code -->
  </body>
</html>
