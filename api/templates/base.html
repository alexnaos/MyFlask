<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Золотов А.С. portfolio: Инженер-проектировщик (ПОС, СПОЗУ, БИМ/XML), ESP8266/ESP32 и Linux." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{ canonical_url }}" />
    <meta property="og:title" content="{{ self.title()|striptags }} | {{ your_name }}" />
    <meta property="og:description" content="Инженер-проектировщик (ПОС, СПОЗУ, БИМ/XML), ESP8266/ESP32 и Linux." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
          crossorigin="anonymous" />

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}" />

    <title>{% block title %}Home{% endblock %} | {{ your_name }}</title>

    <script type="application/ld+json">
      {{ {"@context": "https://schema.org", "@type": "Person", "name": your_name, "url": "https://" ~ domain, "sameAs": [github, linkedin, twitter]} | tojson }}
    </script>

    <!-- Кастомные стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>

  <body class="bg-light text-dark">
    <!-- Здесь задана компактная ширина: max-width: 800px -->
    <div class="container pt-5" style="max-width: 800px;">
      
      <!-- Шапка -->
      <div class="d-flex flex-row align-items-center">
        <a href="{{ url_for('home') }}">
          <img src="{{ url_for('static', filename='images/headshot.jpg') }}"
               class="img-thumbnail rounded-circle shadow-sm"
               alt="{{ your_name }}"
               width="100" height="100" />
        </a>
        <div class="h1 p-3">{{ your_name }}</div>
      </div>

      <!-- Навигация -->
      <nav class="navbar navbar-expand navbar-light border-bottom mb-4">
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">
          <div class="navbar-nav ms-auto">
            <a href="{{ url_for('home') }}" class="nav-item nav-link" id="home">home</a>
            <a href="{{ url_for('resume') }}" class="nav-item nav-link" id="resume">resume</a>
            <a href="/projects/" class="nav-item nav-link" id="projects">projects</a>
          </div>
        </div>
      </nav>

      <!-- Контент -->
      <div>
        {% block content %}{% endblock %}
      </div>

      <!-- Подвал -->
      <small class="d-block mt-5 pb-4">
        <div class="text-muted text-end">
          {{ current_year }} © {{ your_name }}
        </div>
      </small>
    </div>

    <!-- Bootstrap 5.3.8 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <script type="text/javascript" src="{{ url_for('static', filename='index.js') }}"></script>
  </body>
</html>
