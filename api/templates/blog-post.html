{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}

<div class="card-mama mb-8">
  <h1 class="font-mama text-2xl font-bold mb-4 text-gray-900">{{ post.title }}</h1>

  <div class="flex items-center gap-4 mb-6">
    <a href="{{ url_for('posts') }}" class="btn-mama btn-mama-secondary text-sm px-3 py-2">Назад</a>
    <img src="https://visitor-badge.laobi.icu/badge?page_id={{ url_for('post', name=post.path.replace('blogs/', '')) }}"
         alt="Post visitor count" class="h-6 w-auto" />
  </div>

  <div class="literary-text-mama">
    {{ post.html | safe }}
  </div>
</div>

{% if blog_comments %}
<script src="https://utteranc.es/client.js"
        repo="{{ blog_comments }}"
        issue-term="pathname"
        theme="github-light"
        crossorigin="anonymous"
        async></script>
{% endif %}

{% endblock %}
