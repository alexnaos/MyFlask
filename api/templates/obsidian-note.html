{% extends "base.html" %}
{% block title %}{{ title or "Заметка" }}{% endblock %}
{% block content %}

<div class="card-mama mb-8">
  <div class="flex justify-between items-center mb-4">
    <h2 class="font-mama text-xl font-bold text-gray-900">{{ title if title else "Без названия" }}</h2>
    <a href="{{ url_for('home') }}" class="btn-mama btn-mama-secondary text-xs px-3 py-1">← На главную</a>
  </div>

  {% if date %}
  <p class="text-xs text-gray-500 mb-4">Дата: {{ date }}</p>
  {% endif %}

  <div class="literary-text-mama">
    {{ body | safe }}
  </div>
</div>

{% endblock %}
