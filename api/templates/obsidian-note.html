{% extends "base.html" %}
{% block title %}{{ title or "Заметка" }}{% endblock %}
{% block content %}
<div class="card mt-4 shadow-sm">
  <!-- Шапка карточки -->
  <div class="card-header bg-light d-flex justify-content-between align-items-center border-bottom">
    <!-- Убрали инлайн-стили цвета, используем классы Bootstrap -->
    <span class="fw-bold fs-5">
      {{ title if title else "Без названия" }}
    </span>
    <a href="{{ url_for('home') }}" class="btn btn-sm btn-dark">← На главную</a>
  </div>

  <!-- Тело карточки -->
  <div class="card-body">
    {% if date %}
      <!-- Заменили стили на стандартный класс text-muted small -->
      <p class="text-muted small">Дата: {{ date }}</p>
    {% endif %}
    
    <!-- Текст заметки: убрали color, оставили white-space для переносов строк -->
    <div class="fs-5 lh-base" style="white-space: pre-wrap;">
      {{ body | safe }}
    </div>
  </div>
</div>
{% endblock %}
