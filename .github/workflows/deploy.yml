name: Build & Push image

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/alexnaos/myflask

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Проверяем ОБА подпроекта в подпапки: контекст сборки = корень workspace
      - name: Checkout MyFlask
        uses: actions/checkout@v4
        with:
          path: MyFlask

      - name: Checkout ProjectCards
        uses: actions/checkout@v4
        with:
          repository: alexnaos/ProjectCards
          path: ProjectCards
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .dockerignore должен лежать в корне контекста сборки
      - name: Place .dockerignore at context root
        run: cp MyFlask/.dockerignore ./.dockerignore

      - name: Build and push (multiarch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MyFlask/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max