worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # Скрываем версию Nginx
    server_tokens off;

    # ------------------------------------------------------------------
    # Отказоустойчивый upstream.
    # Основной сервер — Debian 103 (192.168.1.103:8080).
    # Резервный (backup) — сервис на этом же Windows-хосте (127.0.0.1:8080).
    # Если основной не отвечает > fail_timeout, Nginx переключает на backup.
    # ------------------------------------------------------------------
    upstream flask_app {
        server 192.168.1.103:8080    max_fails=1 fail_timeout=3s weight=1;
        server 127.0.0.1:8080        backup   max_fails=2 fail_timeout=5s;

        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        # Тайм-ауты к вышестоящему серверу
        proxy_connect_timeout   2s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Повторная попытка (на резервного) при ошибке/таймауте основного
        proxy_next_upstream            error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries      2;
        proxy_next_upstream_timeout    4s;

        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }
    }
}
