# =============================================================================
# Nginx для Debian 103 — вход снаружи по :80 (проброса в роутере).
# Отказоустойчивый upstream:
#   основной — локальный Docker-контейнер (127.0.0.1:8080),
#   резерв — соседний Windows-узел 56 (192.168.1.56:8080).
# Если 103 недоступен — в роутере домен перенаправляется на 56 (см. deploy/README.md).
# =============================================================================
worker_processes  auto;

events { worker_connections 1024; }

http {
    server_tokens off;

    upstream flask_app {
        server 127.0.0.1:8080    max_fails=1 fail_timeout=3s;
        server 192.168.1.56:8080 backup max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name rad.sloboda43.netcraze.pro _;

        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 4s;

        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
