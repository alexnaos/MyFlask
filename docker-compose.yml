# =============================================================================
# MyFlask — объединённое приложение (MyFlask + ProjectCards) в Docker.
# Работает одинаково на Orange Pi / Debian / Windows(Docker Desktop).
# Настройки — в .env (см. .env.example):
#   HOST_YADISK_PATH  — исходная папка с данными (на 103: /srv/myflask/data,
#                       на 56: C:/YandexDisk, локально).
#   BIND_ADDR         — 0.0.0.0 (балансировщик) или 127.0.0.1.
# =============================================================================
services:
  app:
    image: ${IMAGE:-ghcr.io/alexnaos/myflask:latest}
    container_name: myflask-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - "${HOST_YADISK_PATH:?Задайте HOST_YADISK_PATH в .env}:/data:ro"
    environment:
      - MYFLASK_CONTENT_DIR=${MYFLASK_CONTENT_DIR:-/data/Obsidian Vault}
      - CARDS_CONTENT_DIR=${CARDS_CONTENT_DIR:-/data}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      # Современный Docker (>= 1.40 API) без этой переменной ронял watchtower
      - DOCKER_API_VERSION=1.43
    depends_on:
      - app
